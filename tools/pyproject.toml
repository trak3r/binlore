[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binlore-tools"
version = "0.1.0"
description = "VOD ingest and transcript tools for the Binlore wiki"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1.0",
]

[project.scripts]
binlore = "binlore_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["binlore_tools*"]
